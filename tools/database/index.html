<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Titamas Database</title>
<style>
	:root {
		--bg: #2b2a33;
		--window: #e9e6df;
		--panel: #f6f4ef;
		--line: #b9b3a6;
		--ink: #26231e;
		--soft: #6d665a;
		--title: #3c4f7a;
		--title-ink: #f4f0e6;
		--accent: #c9862b;
		--select: #3c6db0;
		--select-ink: #ffffff;
		--dirty: #c0392b;
		--ok: #2e7d4f;
	}
	* { box-sizing: border-box; }
	html, body { height: 100%; margin: 0; }
	body {
		background: var(--bg);
		color: var(--ink);
		font: 14px/1.4 "Segoe UI", "Noto Sans", system-ui, sans-serif;
		display: flex;
		flex-direction: column;
	}
	header {
		display: flex;
		align-items: center;
		gap: 12px;
		padding: 8px 14px;
		background: linear-gradient(#4a5f8f, #34466e);
		color: var(--title-ink);
		border-bottom: 2px solid #1e2a45;
	}
	header h1 { font-size: 17px; margin: 0; letter-spacing: 0.04em; font-weight: 600; }
	header .status { margin-left: auto; font-size: 13px; opacity: 0.9; }
	header .status.dirty { color: #ffd6a0; }
	button {
		font: inherit;
		color: var(--ink);
		background: linear-gradient(#fbfaf7, #dcd7cc);
		border: 1px solid #8f887a;
		border-radius: 3px;
		padding: 4px 12px;
		cursor: pointer;
	}
	button:hover { background: linear-gradient(#ffffff, #e6e1d6); }
	button:disabled { opacity: 0.5; cursor: default; }
	button.primary { background: linear-gradient(#e7a64a, #c9862b); border-color: #8d5b17; color: #2a1b05; font-weight: 600; }
	.window {
		flex: 1;
		display: grid;
		grid-template-columns: 150px 260px 1fr;
		grid-template-rows: minmax(0, 1fr);  /* one row, as tall as the window: the panes scroll */
		gap: 0;
		margin: 10px;
		background: var(--window);
		border: 2px solid #1e2a45;
		border-radius: 4px;
		min-height: 0;
		overflow: hidden;
	}
	nav {
		background: #d9d4c8;
		border-right: 1px solid var(--line);
		overflow-y: auto;
		min-height: 0;
		padding: 8px 6px;
		display: flex;
		flex-direction: column;
		gap: 4px;
	}
	nav button {
		text-align: left;
		background: none;
		border: 1px solid transparent;
		padding: 7px 10px;
	}
	nav button.on { background: var(--select); color: var(--select-ink); border-color: #23497e; }
	nav button .dot { color: var(--dirty); font-weight: bold; }
	nav button.on .dot { color: #ffd6a0; }
	.list {
		display: flex;
		flex-direction: column;
		border-right: 1px solid var(--line);
		min-height: 0;
	}
	.box-title {
		background: linear-gradient(#56709f, #3c4f7a);
		color: var(--title-ink);
		padding: 5px 10px;
		font-size: 13px;
		font-weight: 600;
		letter-spacing: 0.03em;
	}
	.items {
		flex: 1;
		overflow-y: auto;
		background: var(--panel);
		margin: 6px;
		border: 1px solid var(--line);
		font-family: "Consolas", "Cascadia Mono", monospace;
		font-size: 13px;
	}
	.items div {
		padding: 3px 8px;
		cursor: pointer;
		white-space: nowrap;
		overflow: hidden;
		text-overflow: ellipsis;
	}
	.items div:hover { background: #e4ddcd; }
	.items .cat-head { background: #d9d0bd; color: #4a4434; font-weight: 600; cursor: default; font-family: inherit; font-size: 12px; padding: 4px 8px; }
	.items .cat-head:hover { background: #d9d0bd; }
	.items img.li-icon { width: 16px; height: 16px; image-rendering: pixelated; vertical-align: -3px; margin-right: 6px; }
	.cat-bar { display: flex; flex-wrap: wrap; gap: 3px; padding: 6px 6px 0; }
	.cat-bar button { flex: 1 1 auto; padding: 2px 6px; font-size: 12px; }
	.cat-bar button.on { background: var(--select); color: var(--select-ink); border-color: #23497e; }
	.mat-pick { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; }
	.mat-pick button { padding: 1px 6px; font-size: 11px; }
	.mat-pick button.on { background: var(--select); color: var(--select-ink); border-color: #23497e; }
	.mat-pick .mat-all { font-size: 11px; opacity: .6; }
	.placement-grid { display: grid; grid-template-columns: 60px 1fr 1fr 1fr auto; gap: 4px 10px; align-items: center; font-size: 12px; }
	.placement-grid .pl-cell { display: flex; gap: 6px; align-items: center; }
	.placement-grid .pl-cell input { flex: 1; }
	.placement-grid .pl-cell span { width: 34px; font-family: monospace; }
	.look-preview { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
	.look-preview img { background: #2b2e38; border: 1px solid #444; border-radius: 4px; }
	.look-preview .lp-body { width: 156px; height: 252px; }
	.look-preview .lp-face { width: 156px; height: 156px; }
	.look-preview .lp-side { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--soft); max-width: 200px; }
	.icon-pick { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
	.icon-pick .icon-now { width: 48px; height: 48px; image-rendering: pixelated; background: #1e2230; border: 1px solid #444; border-radius: 4px; }
	.icon-grid details { margin: 4px 0; }
	.icon-grid summary { cursor: pointer; font-size: 12px; color: var(--soft); }
	.icon-grid .cells { display: flex; flex-wrap: wrap; gap: 3px; padding: 4px 0; }
	.icon-grid .cells img { width: 32px; height: 32px; image-rendering: pixelated; background: #1e2230; border: 2px solid transparent; border-radius: 3px; cursor: pointer; }
	.icon-grid .cells img.on { border-color: #ffd35c; }
	.icon-grid .cells img:hover { border-color: #8ab4ff; }
	.items div.on { background: var(--select); color: var(--select-ink); }
	.list .tools { display: flex; gap: 6px; padding: 0 6px 8px; }
	.list .tools button { flex: 1; padding: 4px 4px; }
	.detail { overflow-y: auto; min-height: 0; }
	.detail .inner { padding: 10px 14px 80px; max-width: 900px; }
	fieldset {
		border: 1px solid var(--line);
		border-radius: 3px;
		background: var(--panel);
		margin: 0 0 12px;
		padding: 8px 12px 12px;
	}
	legend {
		background: var(--title);
		color: var(--title-ink);
		padding: 2px 10px;
		border-radius: 2px;
		font-size: 12px;
		font-weight: 600;
		letter-spacing: 0.04em;
	}
	.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px 14px; }
	.field { display: flex; flex-direction: column; gap: 3px; }
	.field.wide { grid-column: 1 / -1; }
	.field label { font-size: 12px; color: var(--soft); font-weight: 600; }
	.field .help { font-size: 11.5px; color: var(--soft); }
	.rebuild-log { max-height: 260px; overflow: auto; font-size: 11px; background: rgba(0,0,0,0.25); padding: 8px; border-radius: 6px; white-space: pre-wrap; margin-top: 8px; }
	input[type=text], input[type=number], select, textarea {
		font: inherit;
		color: var(--ink);
		background: #fff;
		border: 1px solid #a69f90;
		border-radius: 2px;
		padding: 4px 6px;
		width: 100%;
	}
	textarea { min-height: 54px; resize: vertical; }
	input[type=color] { width: 54px; height: 28px; padding: 0 2px; border: 1px solid #a69f90; background: #fff; }
	.color-row { display: flex; gap: 8px; align-items: center; }
	.sprite-preview { width: 48px; height: 48px; object-fit: contain; image-rendering: pixelated; background: #1e2230; border: 1px solid #444; border-radius: 4px; flex: none; }
	.color-row input[type=text] { width: 100px; font-family: monospace; }
	.check { flex-direction: row; align-items: center; gap: 8px; padding-top: 18px; }
	.list-field .row { display: flex; gap: 6px; margin-bottom: 4px; }
	.list-field .row select { flex: 1; }
	.list-field .row button { padding: 2px 8px; }
	.parts { display: flex; flex-wrap: wrap; gap: 6px 14px; }
	.parts .part { font-weight: normal; color: var(--ink); font-size: 13px; }
	.list-field .row span { align-self: center; font-size: 12px; color: var(--soft); }
	.rect { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
	.rect span { font-size: 11px; color: var(--soft); }
	.ev-tabs { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
	.ev-tabs button.on { background: var(--select); color: var(--select-ink); border-color: #23497e; }
	.ev-hint { font-size: 11.5px; color: var(--soft); margin-left: 8px; }
	.ev-bar { display: flex; gap: 6px; margin-bottom: 6px; }
	.ev-bar select { width: auto; flex: 1; max-width: 260px; }
	.ev-lines { background: #fff; border: 1px solid #a69f90; font-family: "Consolas", "Cascadia Mono", monospace; font-size: 13px; max-height: 340px; min-height: 120px; overflow-y: auto; outline: none; }
	.ev-line { padding: 2px 8px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	.ev-line:hover { background: #ece6d8; }
	.ev-line.on { background: var(--select); color: var(--select-ink); }
	.ev-line.label { color: #6a5a8a; cursor: default; }
	.ev-line.label:hover { background: none; }
	.ev-line.insert { color: #a69f90; }
	.ev-line.c-text { color: #20304f; }
	.ev-line.c-if, .ev-line.c-choice { color: #2b5ea8; font-weight: 600; }
	.ev-line.c-switch, .ev-line.c-self_switch, .ev-line.c-variable { color: #b0322a; }
	.ev-line.c-give_item, .ev-line.c-take_item, .ev-line.c-gold, .ev-line.c-xp { color: #2e7d4f; }
	.ev-line.c-teleport, .ev-line.c-fade_out, .ev-line.c-fade_in, .ev-line.c-set_home { color: #8a5a10; }
	.ev-line.c-note { color: #888; font-style: italic; }
	.ev-line.on[class*=" c-"] { color: var(--select-ink); }
	.ev-edit { margin-top: 10px; border: 1px solid var(--line); border-radius: 3px; padding: 8px 10px; background: #efece4; }
	.ev-edit-title { font-weight: 600; font-size: 12px; color: var(--title); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
	.ev .list-field .row input[type=text] { flex: 1; }
	.empty { padding: 30px; color: var(--soft); }
	.toast {
		position: fixed;
		bottom: 18px;
		left: 50%;
		transform: translateX(-50%);
		background: #222;
		color: #fff;
		padding: 8px 16px;
		border-radius: 4px;
		opacity: 0;
		transition: opacity 0.2s;
		pointer-events: none;
	}
	.toast.show { opacity: 0.95; }
	.toast.bad { background: var(--dirty); }
	.warn { color: var(--dirty); font-size: 12px; }
	@media (max-width: 760px) {
		.window { grid-template-columns: 1fr; grid-template-rows: auto 200px 1fr; }
		nav { flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line); }
	}
</style>
</head>
<body>
<header>
	<h1>TITAMAS DATABASE</h1>
	<span id="status" class="status">Loading…</span>
	<button id="revert" title="Throw away unsaved changes">Revert</button>
	<button id="save" class="primary" title="Save all changes (Ctrl+S)">Save</button>
</header>
<div class="window">
	<nav id="nav"></nav>
	<section class="list">
		<div class="box-title" id="list-title">List</div>
		<div class="cat-bar" id="cat-bar"></div>
		<div class="items" id="items"></div>
		<div class="tools">
			<button id="add">New</button>
			<button id="copy">Copy</button>
			<button id="del">Delete</button>
		</div>
	</section>
	<section class="detail"><div class="inner" id="detail"></div></section>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";

// ---------------------------------------------------------------------------
// Schemas: what each tab edits. Field types: text, textarea, number, int, bool,
// color, select, anim, sound, sounds, ability, abilities, rect.
// `show(entry)` hides fields that don't apply.
// ---------------------------------------------------------------------------
const isMelee = e => e.delivery === "melee";
const isProjectile = e => e.delivery === "projectile";
const isHeal = e => e.delivery === "heal_over_time";
const isBuff = e => e.delivery === "buff";
const isChain = e => e.delivery === "chain";
const isCone = e => e.delivery === "cone";
const isGround = e => e.delivery === "ground";
// Effect sprite pictures: built-in ones first, then yours.
const spriteOptions = () => (assets.sprites || []).slice().sort((a, b) => (a.includes("/custom/") - b.includes("/custom/")) || a.localeCompare(b))
	.map(p => [p, (p.includes("/custom/") ? "Yours: " : "Built-in: ") + p.split("/").pop().replace(/\.png$/, "").replace(/_/g, " ")]);
const fxFields = (slot, what, sizeHelp) => [
	{ key: "fx." + slot + ".sprite", label: what, type: "sprite", wide: true },
	{ key: "fx." + slot + ".size", label: "Size (m)", type: "number", def: 1, help: sizeHelp, show: e => !!(((e.fx || {})[slot] || {}).sprite) },
	{ key: "fx." + slot + ".seconds", label: "Lasts / loops every (s)", type: "number", def: 0.5, help: "How long it shows, or how long one run through its frames takes when it loops.", show: e => !!(((e.fx || {})[slot] || {}).sprite) },
	{ key: "fx." + slot + ".frames", label: "Frames", type: "int", def: 1, help: "For an animated picture: frames side by side in one row, all the same size. 1 = a still picture.", show: e => !!(((e.fx || {})[slot] || {}).sprite) },
	{ key: "fx." + slot + ".look", label: "Look", type: "select", options: [["glow", "Glow (shines, tinted with the ability's colour)"], ["drawn", "As drawn (your colours and outlines)"]], show: e => !!(((e.fx || {})[slot] || {}).sprite) },
];

// Character looks (NPCs and enemies): the same choices as the character creator.
const LOOK_FIELDS = [
	{ key: "_preview", label: "Preview", type: "lookpreview", wide: true },
	{ key: "look.skin", label: "Skin colour", type: "color" },
	{ key: "look.figure", label: "Body type", type: "select", options: [[0, "Body Type 1"], [1, "Body Type 2"]], help: "Type 2 = the same body reshaped (Body Models → Body type 2)." },
	{ key: "look.species", label: "Species (sets head, height, build)", type: "select", empty: true, options: () => (((data.species || {}).species) || []).map(x => [x.id, x.name]) },
	{ key: "look.head", label: "Head", type: "lookopt", list: "heads" },
	{ key: "look.face", label: "Face", type: "lookopt", list: "faces", help: "Detailed = eyes, brows, nose, mouth and extras below. Painted = the simple painted face (ignores them). (none) = the default." },
	{ key: "look.hair", label: "Hair style", type: "lookopt", list: "hair_styles" },
	{ key: "look.hair_color", label: "Hair colour", type: "color", help: "Also the brows." },
	{ key: "look.facial_hair", label: "Facial hair", type: "lookopt", list: "facial_hair" },
	{ key: "look.facial_color", label: "Facial hair colour", type: "color" },
	{ key: "look.eyes", label: "Eyes", type: "lookopt", list: "eyes" },
	{ key: "look.eye_color", label: "Eye colour (left eye when not mirrored)", type: "color" },
	{ key: "look.mirror_eyes", label: "Both eyes the same colour", type: "bool", def: true, rerender: true, help: "Off = heterochromia: the right eye gets its own colour (species with Heterochromia are always off)." },
	{ key: "look.eye_color_right", label: "Right eye colour", type: "color", show: e => (e.look || {}).mirror_eyes === false },
	{ key: "look.brows", label: "Brows", type: "lookopt", list: "brows" },
	{ key: "look.nose", label: "Nose", type: "lookopt", list: "noses" },
	{ key: "look.mouth", label: "Mouth", type: "lookopt", list: "mouths" },
	{ key: "look.extras", label: "Extras", type: "lookextras", wide: true },
	{ key: "look.placement", label: "Placement (like the creator's Customize placement)", type: "placement", wide: true },
	{ key: "look.height", label: "Height", type: "lookopt", list: "heights" },
	{ key: "look.build", label: "Build", type: "lookopt", list: "builds" },
];
// Look previews: POST /api/preview → the plugin renders the look in the editor.
let previewEls = null, previewTimer = 0, previewKey = "", previewLast = null, previewBusy = false, previewAgain = null;
function requestPreview(entry, force) {
	if (!previewEls || !entry) return;
	const want = { look: entry.look || {}, equipment: entry.equipment || {} };
	const key = JSON.stringify(want);
	if (!force && key === previewKey && previewLast) { showPreview(previewLast); return; }
	if (previewBusy) { previewAgain = entry; return; }
	previewBusy = true;
	previewEls.status.textContent = "Rendering…";
	fetch("/api/preview", { method: "POST", body: key }).then(r => r.json()).then(res => {
		previewBusy = false;
		if (!res.ok) { previewEls.status.textContent = res.error || "Couldn't render"; }
		else { previewKey = key; previewLast = res; showPreview(res); previewEls.status.textContent = ""; }
		if (previewAgain) { const e = previewAgain; previewAgain = null; requestPreview(e, false); }
	}).catch(() => { previewBusy = false; if (previewEls) previewEls.status.textContent = "Preview needs Godot (open the page from the Database button)."; });
}
function showPreview(res) {
	if (!previewEls) return;
	previewEls.body.src = "data:image/png;base64," + res.body;
	previewEls.face.src = "data:image/png;base64," + res.face;
}
function schedulePreview() {
	if (!previewEls || !document.body.contains(previewEls.body)) { previewEls = null; return; }
	clearTimeout(previewTimer);
	previewTimer = setTimeout(() => {
		const t = TABS[tab];
		const list = data[t.file] && data[t.file][t.listKey];
		if (list) requestPreview(list[selected[tab]], false);
	}, 600);
}

// Item groups (same as the backpack tabs, CharacterWindow.tab_of).
const ITEM_CATS = [["consumables", "Consumables"], ["weapons", "Weapons"], ["armor", "Armour"], ["key", "Key items"], ["misc", "Misc"]];
function itemCategory(it) {
	const k = it.kind || "";
	if (it.keep || k === "quest" || k === "key") return "key";
	if (k === "weapon") return "weapons";
	if (k === "armor") return "armor";
	if (k === "consumable" || k === "food") return "consumables";
	return "misc";
}
// Icons drawn in code before the Saturn icons (still work, coloured by Icon colour).
const LEGACY_ICONS = ["sword", "dagger", "axe", "hammer", "bow", "crossbow", "gun", "shield", "helm", "shoulders", "chest", "legs", "boots", "gloves", "potion", "bandage", "coin", "cloth", "bag", "hearthstone", "log", "ore"];
const iconUrl = icon => !icon ? "" : icon.startsWith("builtin:") ? "/sprite/assets/icons/items/" + encodeURIComponent(icon.slice(8)) + ".png"
	: icon.startsWith("res://") ? "/sprite/" + icon.replace("res://", "").split("/").map(encodeURIComponent).join("/") : "";
// Saturn's tintCanvas: the tint's hue (and most of its saturation), each pixel's own lightness; outline and glints kept.
const tintCache = new Map();
function itemIconSrc(icon, tint) {
	const url = iconUrl(icon);
	if (!url || !tint || !/^#[0-9a-fA-F]{6}/.test(tint)) return url;
	const key = url + "|" + tint;
	if (tintCache.has(key)) return tintCache.get(key) || url;
	tintCache.set(key, null);
	const img = new Image();
	img.onload = () => {
		const c = document.createElement("canvas");
		c.width = img.width; c.height = img.height;
		const g = c.getContext("2d");
		g.drawImage(img, 0, 0);
		const im = g.getImageData(0, 0, c.width, c.height), d = im.data;
		const t = parseInt(tint.slice(1, 7), 16);
		const [th, ts, tl] = rgbToHsl((t >> 16) & 255, (t >> 8) & 255, t & 255);
		for (let i = 0; i < d.length; i += 4) {
			if (d[i + 3] < 8) continue;
			const [, sat, l] = rgbToHsl(d[i], d[i + 1], d[i + 2]);
			if (l < 0.13 || l > 0.97) continue;
			const [r, gg, b] = hslToRgb(th, Math.min(1, ts * (sat > 0.12 ? 1 : 0.6)), Math.max(0, Math.min(1, l + (tl - 0.5) * 0.35)));
			d[i] = r; d[i + 1] = gg; d[i + 2] = b;
		}
		g.putImageData(im, 0, 0);
		tintCache.set(key, c.toDataURL());
		document.querySelectorAll("img[data-tint-key]").forEach(e => { if (e.dataset.tintKey === key) e.src = tintCache.get(key); });
	};
	img.src = url;
	return url;
}
function rgbToHsl(r, g, b) {
	r /= 255; g /= 255; b /= 255;
	const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
	if (mx === mn) return [0, 0, l];
	const dd = mx - mn, sat = l > 0.5 ? dd / (2 - mx - mn) : dd / (mx + mn);
	const h = mx === r ? (g - b) / dd + (g < b ? 6 : 0) : mx === g ? (b - r) / dd + 2 : (r - g) / dd + 4;
	return [h / 6, sat, l];
}
function hslToRgb(h, sat, l) {
	if (!sat) { const v = Math.round(l * 255); return [v, v, v]; }
	const q = l < 0.5 ? l * (1 + sat) : l + sat - l * sat, p = 2 * l - q;
	const f = t => { t = (t + 1) % 1; return t < 1 / 6 ? p + (q - p) * 6 * t : t < 1 / 2 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p; };
	return [Math.round(f(h + 1 / 3) * 255), Math.round(f(h) * 255), Math.round(f(h - 1 / 3) * 255)];
}
// An <img> for an item icon that picks up its tinted copy once it's made.
function iconImg(icon, tint, cls) {
	const img = el("img", { className: cls || "", alt: "" });
	const src = itemIconSrc(icon, tint);

// ---------------------------------------------------------------------------
let data = {};       // file -> JSON
let saved = {};      // file -> JSON string as last saved
let assets = { animations: [], sounds: [], fbx: [], sprites: [], videos: [] };
let tab = "abilities";
let selected = { abilities: 0, enemies: 0, regions: 0 };

const $ = id => document.getElementById(id);
const clone = v => JSON.parse(JSON.stringify(v));
const dirty = file => JSON.stringify(data[file]) !== saved[file];

function toast(text, bad = false) {
	const t = $("toast");
	t.textContent = text;
	t.className = "toast show" + (bad ? " bad" : "");
	clearTimeout(toast.timer);
	toast.timer = setTimeout(() => t.className = "toast", 2200);
}

function getPath(obj, path) {
	return path.split(".").reduce((o, k) => (o == null ? undefined : o[k]), obj);
}
function setPath(obj, path, value) {
	const keys = path.split(".");
	let o = obj;
	for (const k of keys.slice(0, -1)) { if (o[k] == null || typeof o[k] !== "object") o[k] = {}; o = o[k]; }
	o[keys[keys.length - 1]] = value;
}

async function load() {
	try {
		const [d, a] = await Promise.all([fetch("/api/data").then(r => r.json()), fetch("/api/assets").then(r => r.json())]);
		assets = a;
		for (const key of Object.keys(TABS)) {
			const t = TABS[key];
			data[t.file] = d[t.file] || (t.single ? {} : { [t.listKey]: [] });
			saved[t.file] = JSON.stringify(data[t.file]);
		}
		// Files without a tab of their own (appearance.json: the creator's choices) are read only.
		for (const key of Object.keys(d)) if (!(key in data) && d[key]) data[key] = d[key];
		render();
	} catch (e) {
		$("status").textContent = "Can't reach Godot. Open this page from Godot's Database button.";
	}
}

async function save() {
	const files = Object.values(TABS).map(t => t.file).filter(dirty);
	if (!files.length) { toast("Nothing to save"); return; }
	const problems = validate();
	if (problems.length) { toast(problems[0], true); return; }
	for (const file of files) {
		const r = await fetch("/api/save", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ file, data: data[file] }) })
			.then(r => r.json()).catch(() => ({ ok: false, error: "Godot isn't answering" }));
		if (!r.ok) { toast("Couldn't save " + file + ": " + (r.error || "error"), true); return; }
		saved[file] = JSON.stringify(data[file]);
	}
	toast("Saved " + files.join(", ") + ". A running game updates within a second.");
	render();
}

function validate() {
	const out = [];
	for (const key of ["abilities", "items", "enemies", "regions", "events"]) {
		const t = TABS[key];
		const seen = new Set();
		for (const e of data[t.file][t.listKey]) {
			const id = e[t.idKey];
			if (!id) out.push(t.title + ": every entry needs an ID.");
			else if (seen.has(id)) out.push(t.title + ": the ID \"" + id + "\" is used twice.");
			seen.add(id);
		}
	}
	return out;
}

// When an ability's ID changes, keep the player's loadout pointing at it.
function renameAbility(from, to) {
	const l = (data.player || {}).loadout;
	if (!l) return;
	const fix = v => (v === from ? to : v);
	if (Array.isArray(l.light_combo)) l.light_combo = l.light_combo.map(fix);
	if (Array.isArray(l.spells)) l.spells = l.spells.map(fix);
	l.heavy_attack = fix(l.heavy_attack);
	l.ranged_attack = fix(l.ranged_attack);
}

// When an item's ID changes, keep loot tables and the starting kit pointing at it.
function renameItem(from, to) {
	const fix = v => (v === from ? to : v);
	for (const e of ((data.enemies || {}).enemies || [])) {
		for (const r of (e.loot || [])) r.item = fix(r.item);
	}
	const kits = [(data.player || {}).starting_kit, ...((data.classes || {}).classes || []).map(c => c.starting_kit),
		...((data.npcs || {}).npcs || []).map(n => ({ equipment: n.equipment || {} }))];
	for (const kit of kits) {
		if (!kit || typeof kit !== "object") continue;
		for (const slot of Object.keys(kit.equipment || {})) kit.equipment[slot] = fix(kit.equipment[slot]);
		for (const r of (kit.backpack || [])) r[0] = fix(r[0]);
		if (Array.isArray(kit.quick)) kit.quick = kit.quick.map(fix);
	}
}

// ---------------------------------------------------------------------------
function render() {
	const anyDirty = Object.values(TABS).some(t => dirty(t.file));
	$("status").textContent = anyDirty ? "Unsaved changes" : "All saved";
	$("status").className = "status" + (anyDirty ? " dirty" : "");
	$("save").disabled = !anyDirty;
	$("revert").disabled = !anyDirty;

	const nav = $("nav");
	nav.innerHTML = "";
	for (const key of Object.keys(TABS)) {
		const b = document.createElement("button");
		b.className = key === tab ? "on" : "";
		b.innerHTML = TABS[key].title + (dirty(TABS[key].file) ? ' <span class="dot">•</span>' : "");
		b.onclick = () => { tab = key; render(); };
		nav.appendChild(b);
	}

	const t = TABS[tab];
	const listSection = document.querySelector(".list");
	listSection.style.display = t.single ? "none" : "";
	document.querySelector(".window").style.gridTemplateColumns = t.single ? "150px 1fr" : "";
	if (!t.single) renderList(t);
	renderDetail(t);
}

function renderList(t) {
	$("list-title").textContent = t.title;
	const list = data[t.file][t.listKey];
	const items = $("items");
	items.innerHTML = "";
	selected[tab] = Math.max(0, Math.min(selected[tab] ?? 0, list.length - 1));
	// Tabs with categories (Items): a bar to show one group, and the full list split under headings.
	const bar = $("cat-bar");
	bar.innerHTML = "";
	bar.style.display = t.categories ? "" : "none";
	const cat = t.categories ? (listCat[tab] || "") : "";
	if (t.categories) {
		for (const [id, label] of [["", "All"]].concat(t.categories)) {
			const n = id ? list.filter(e => t.categoryOf(e) === id).length : list.length;
			const b = el("button", { textContent: label + " " + n, className: id === cat ? "on" : "" });
			b.onclick = () => {
				listCat[tab] = id;
				const first = list.findIndex(e => !id || t.categoryOf(e) === id);
				if (first >= 0 && id && t.categoryOf(list[selected[tab]] || {}) !== id) selected[tab] = first;
				render();
			};
			bar.appendChild(b);
		}
	}
	const row = (e, i) => {
		const div = document.createElement("div");
		if (t.iconOf) div.appendChild(iconImg(e.icon, e.icon_tint, "li-icon"));
		div.appendChild(document.createTextNode(String(i + 1).padStart(4, "0") + ": " + (e[t.nameKey] || e[t.idKey] || "")));
		div.className = i === selected[tab] ? "on" : "";
		div.onclick = () => { selected[tab] = i; render(); };
		items.appendChild(div);
	};
	if (t.categories) {
		for (const [id, label] of t.categories) {
			if (cat && cat !== id) continue;
			const members = list.map((e, i) => [e, i]).filter(([e]) => t.categoryOf(e) === id);
			if (!members.length) continue;
			if (!cat) items.appendChild(el("div", { className: "cat-head", textContent: label }));
			members.forEach(([e, i]) => row(e, i));
		}
	} else list.forEach(row);
	$("del").disabled = list.length === 0;
	$("copy").disabled = list.length === 0;
}

function uniqueId(list, idKey, base) {
	let id = base, n = 2;
	while (list.some(e => e[idKey] === id)) id = base + "_" + n++;
	return id;
}

$("add").onclick = () => {
	const t = TABS[tab];
	const list = data[t.file][t.listKey];
	const e = t.blank();
	e[t.idKey] = uniqueId(list, t.idKey, e[t.idKey]);
	if (tab === "items" && listCat.items) e.kind = { consumables: "consumable", weapons: "weapon", armor: "armor", key: "key", misc: "material" }[listCat.items];
	list.push(e);
	selected[tab] = list.length - 1;
	render();
};
$("copy").onclick = () => {
	const t = TABS[tab];
	const list = data[t.file][t.listKey];
	const src = list[selected[tab]];
	if (!src) return;
	const e = clone(src);
	e[t.idKey] = uniqueId(list, t.idKey, src[t.idKey] + "_copy");
	if (t.nameKey) e[t.nameKey] = (src[t.nameKey] || "") + " (copy)";
	if ("default" in e) e.default = false;
	list.splice(selected[tab] + 1, 0, e);
	selected[tab] += 1;
	render();
};
$("del").onclick = () => {
	const t = TABS[tab];
	const list = data[t.file][t.listKey];
	const e = list[selected[tab]];
	if (!e || !confirm("Delete " + (e[t.nameKey] || e[t.idKey]) + "?")) return;
	list.splice(selected[tab], 1);
	render();
};
$("save").onclick = save;
$("revert").onclick = () => {
	if (!confirm("Throw away all unsaved changes?")) return;
	for (const t of Object.values(TABS)) data[t.file] = JSON.parse(saved[t.file]);
	render();
};
document.addEventListener("keydown", e => {
	if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); save(); }
});
window.addEventListener("beforeunload", e => {
	if (Object.values(TABS).some(t => dirty(t.file))) { e.preventDefault(); e.returnValue = ""; }
});

function renderDetail(t) {
	const box = $("detail");
	box.innerHTML = "";
	let entry;
	if (t.single) entry = data[t.file];
	else {
		entry = data[t.file][t.listKey][selected[tab]];
		if (!entry) { box.innerHTML = '<div class="empty">Nothing here yet. Press New.</div>'; return; }
	}
	for (const [title, fields, show] of t.groups) {
		if (show && !show(entry)) continue;
		const fs = document.createElement("fieldset");
		fs.innerHTML = "<legend>" + title + "</legend>";
		const grid = document.createElement("div");
		grid.className = "grid";
		for (const f of fields) {
			if (f.show && !f.show(entry)) continue;
			grid.appendChild(fieldControl(t, entry, f));
		}
		fs.appendChild(grid);
		box.appendChild(fs);
	}
}

function changed(rerender = false) {
	if (tab === "npcs" || tab === "enemies") schedulePreview();
	if (rerender) render();
	else {
		const anyDirty = Object.values(TABS).some(t => dirty(t.file));
		$("status").textContent = anyDirty ? "Unsaved changes" : "All saved";
		$("status").className = "status" + (anyDirty ? " dirty" : "");
		$("save").disabled = !anyDirty;
		$("revert").disabled = !anyDirty;
		// Refresh the list label and nav dots without rebuilding the form.
		const t = TABS[tab];
		document.querySelectorAll("#nav button").forEach((b, i) => {
			const tt = TABS[Object.keys(TABS)[i]];
			b.innerHTML = tt.title + (dirty(tt.file) ? ' <span class="dot">•</span>' : "");
		});
		if (!t.single) {
			const e = data[t.file][t.listKey][selected[tab]];
			const div = $("items").children[selected[tab]];
			if (div && e) div.textContent = String(selected[tab] + 1).padStart(4, "0") + ": " + (e[t.nameKey] || e[t.idKey] || "");
		}
	}
}

function el(tag, attrs = {}) {
	const e = document.createElement(tag);
	Object.assign(e, attrs);
	return e;
}

function selectOf(options, value, allowEmpty) {
	const s = el("select");
	if (allowEmpty) s.appendChild(el("option", { value: "", textContent: "(none)" }));
	let found = false;
	const groups = {};  // options with a third entry go under that <optgroup>
	for (const o of options) {
		const [v, label, group] = Array.isArray(o) ? o : [o, o];
		const opt = el("option", { value: v, textContent: label });
		if (v === value) { opt.selected = true; found = true; }
		if (group) {
			if (!groups[group]) s.appendChild(groups[group] = el("optgroup", { label: group }));
			groups[group].appendChild(opt);
		} else s.appendChild(opt);
	}
	if (!found && value) {
		const opt = el("option", { value, textContent: value + " (missing)" });
		opt.selected = true;
		s.appendChild(opt);
	}
	return s;
}

function condText(conds) {
	if (!conds || !conds.length) return "(always)";
	return conds.map(c => {
		switch (c.type) {
			case "switch": return nameOf(switchOptions(), c.id) + " is " + (c.is === false ? "OFF" : "ON");
			case "self": return "Self " + c.letter + " is " + (c.is === false ? "OFF" : "ON");
			case "variable": return nameOf(variableOptions(), c.id) + " " + c.op + " " + c.value;
			case "item": return "has " + itemName(c.item) + " x" + (c.count || 1);
			case "gold": return "gold ≥ " + c.value;
			case "level": return "level ≥ " + c.value;
			case "class": return "class is " + nameOf(classOptions(), c.id);
			case "quest": return "quest " + (c.id || "?") + " is " + c.state;
			case "holiday": return c.id ? "holiday " + c.id : "any holiday";
			case "moon": return "moon is " + (MOON_PHASES.find(p => p[0] === c.phase) || [0, c.phase])[1];
			case "date": return "date " + c.from + (c.to && c.to !== c.from ? " – " + c.to : "");
		}
		return "?";
	}).join(" and ");
}

const COND_TYPES = [["switch", "Switch"], ["self", "Self switch"], ["variable", "Variable"], ["item", "Has item"], ["gold", "Has gold"], ["level", "Level at least"], ["class", "Class is"], ["quest", "Quest is"], ["holiday", "Holiday is on (real date)"], ["moon", "Moon phase is (real moon)"], ["date", "Date is between (real date)"]];

const MOON_PHASES = [["new", "New Moon"], ["waxing_crescent", "Waxing Crescent"], ["first_quarter", "First Quarter"], ["waxing_gibbous", "Waxing Gibbous"], ["full", "Full Moon"], ["waning_gibbous", "Waning Gibbous"], ["last_quarter", "Last Quarter"], ["waning_crescent", "Waning Crescent"]];
const holidayOptions = () => (((data.world || {}).holidays) || []).map(h => [h.id, h.name || h.id]);

// Rows of conditions, edited in place.
function conditionsEditor(list, onChange) {
	const box = el("div", { className: "list-field" });
	list.forEach((c, i) => {
		const row = el("div", { className: "row" });
		const type = selectOf(COND_TYPES, c.type, false);
		type.style.flex = "0 0 130px";
		type.onchange = () => { list[i] = Object.assign({ type: type.value }, clone(COND_BLANK[type.value])); onChange(true); };
		row.appendChild(type);
		const sel = (opts, key, empty) => { const s = selectOf(opts, c[key], empty); s.onchange = () => { c[key] = s.value; onChange(); }; row.appendChild(s); };
		const num = (key, w) => { const n = el("input", { type: "number", value: c[key] ?? 0, step: "any" }); n.style.width = w; n.oninput = () => { const v = parseFloat(n.value); if (!Number.isNaN(v)) { c[key] = v; onChange(); } }; row.appendChild(n); };
		const onoff = () => { const s = selectOf([["on", "is ON"], ["off", "is OFF"]], c.is === false ? "off" : "on", false); s.style.flex = "0 0 80px"; s.onchange = () => { c.is = s.value === "on"; onChange(); }; row.appendChild(s); };
		switch (c.type) {
			case "switch": sel(switchOptions(), "id", true); onoff(); break;
			case "self": sel(["A", "B", "C", "D"], "letter", false); onoff(); break;
			case "variable": sel(variableOptions(), "id", true); { const s = selectOf([">=", "<=", "==", "!=", ">", "<"], c.op, false); s.style.flex = "0 0 60px"; s.onchange = () => { c.op = s.value; onChange(); }; row.appendChild(s); } num("value", "80px"); break;
			case "item": sel(itemOptions(), "item", true); row.appendChild(el("span", { textContent: "×" })); num("count", "60px"); break;
			case "gold": case "level": num("value", "100px"); break;
			case "class": sel(classOptions(), "id", true); break;
			case "quest": sel(questOptions(), "id", true); sel([["not_started", "not started"], ["active", "active"], ["ready", "ready to hand in"], ["done", "done"], ["failed", "failed"]], "state", false); break;
			case "holiday": sel([["", "(any holiday)"]].concat(holidayOptions()), "id", false); onoff(); break;
			case "moon": sel(MOON_PHASES, "phase", false); onoff(); break;
			case "date": {
				const t = key => { const i = el("input", { type: "text", value: c[key] || "", placeholder: "MM-DD" }); i.style.width = "70px"; i.oninput = () => { c[key] = i.value; onChange(); }; row.appendChild(i); };
				t("from"); row.appendChild(el("span", { textContent: "to" })); t("to"); onoff(); break;
			}
		}
		const rm = el("button", { textContent: "✕", title: "Remove" });
		rm.onclick = () => { list.splice(i, 1); onChange(true); };
		row.appendChild(rm);
		box.appendChild(row);
	});
	const add = el("button", { textContent: "+ Condition" });
	add.onclick = () => { list.push({ type: "switch", id: "", is: true }); onChange(true); };
	box.appendChild(add);
	return box;
}

// UI state per event: which page, which line is selected, the copied command.
const evUI = { page: {}, sel: null, clip: null };

// The command tree as lines: commands, branch labels and the empty "◆" lines you
// insert at to add to the end of a list.
function flattenCommands(list, depth, out) {
	list.forEach((c, i) => {
		out.push({ list, i, depth, c });
		if (c.cmd === "if") {
			c.then = c.then || []; c.else = c.else || [];
			flattenCommands(c.then, depth + 1, out);
			out.push({ list: c.then, i: c.then.length, depth: depth + 1, insert: true });
			out.push({ label: ": Else", depth });
			flattenCommands(c.else, depth + 1, out);
			out.push({ list: c.else, i: c.else.length, depth: depth + 1, insert: true });
			out.push({ label: ": End", depth });
		} else if (c.cmd === "quest" && c.op === "offer") {
			c.accepted = c.accepted || []; c.declined = c.declined || [];
			out.push({ label: ": If accepted", depth });
			flattenCommands(c.accepted, depth + 1, out);
			out.push({ list: c.accepted, i: c.accepted.length, depth: depth + 1, insert: true });
			out.push({ label: ": If declined", depth });
			flattenCommands(c.declined, depth + 1, out);
			out.push({ list: c.declined, i: c.declined.length, depth: depth + 1, insert: true });
			out.push({ label: ": End", depth });
		} else if (c.cmd === "choice") {
			c.options = c.options || [];
			c.branches = c.branches || [];
			while (c.branches.length < c.options.length) c.branches.push([]);
			c.options.forEach((o, k) => {
				out.push({ label: ": When [" + o + "]", depth });
				flattenCommands(c.branches[k], depth + 1, out);
				out.push({ list: c.branches[k], i: c.branches[k].length, depth: depth + 1, insert: true });
			});
			out.push({ label: ": End", depth });
		}
	});
	return out;
}


// --- Skill tree editor: a grid of tiers x columns; each cell can hold one skill. ---------
const SKILL_STATS = [["attack", "Attack"], ["spell_power", "Spell power"], ["armor", "Armour"], ["block", "Block"], ["bonus_health", "Max health"], ["bonus_mana", "Max mana"], ["crit_chance", "Crit chance (%)"], ["move_speed", "Move speed (%)"], ["stamina", "Max stamina"]];
let skillPick = {};  // tree id -> selected node id
function skillTreeEditor(tree) {
	// Saturn-style: the tree as a constellation (row 0 at the bottom, growing up). Click a skill
	// to edit it, drag it to move it (half steps), "+ Skill" adds one.
	if (!Array.isArray(tree.nodes)) tree.nodes = [];
	const box = el("div", { className: "skilltree" });
	const color = tree.color || "#c9a25a";
	const CELL = 78;
	const nodes = tree.nodes;
	const maxX = Math.max(4, ...nodes.map(n => +n.col || 0)), maxY = Math.max(2, ...nodes.map(n => +n.row || 0));
	const W = (maxX + 2) * CELL, H = (maxY + 2) * CELL;
	const pos = n => [(+n.col || 0) * CELL + CELL / 2, (maxY + 1 - (+n.row || 0)) * CELL + CELL / 2];
	const ns = "http://www.w3.org/2000/svg";
	const svg = document.createElementNS(ns, "svg");
	svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
	svg.setAttribute("class", "sk-ed-map");
	svg.style.cssText = `width:100%;max-height:420px;background:#141826;border-radius:10px;margin-bottom:10px;touch-action:none`;
	for (let x = 0; x <= maxX + 1; x++) for (let y = 0; y <= maxY + 1; y++) {
		const c = document.createElementNS(ns, "circle");
		c.setAttribute("cx", x * CELL + CELL / 2); c.setAttribute("cy", (maxY + 1 - y) * CELL + CELL / 2); c.setAttribute("r", 2);
		c.setAttribute("fill", "rgba(255,255,255,.12)");
		svg.appendChild(c);
	}
	for (const n of nodes) for (const pid of n.requires || []) {
		const p = nodes.find(m => m.id === pid);
		if (!p) continue;
		const [x1, y1] = pos(p), [x2, y2] = pos(n), l = document.createElementNS(ns, "line");
		Object.entries({ x1, y1, x2, y2 }).forEach(([k, v]) => l.setAttribute(k, v));
		l.setAttribute("stroke", "rgba(255,255,255,.28)"); l.setAttribute("stroke-width", 3);
		svg.appendChild(l);
	}
	const picked = skillPick[tree.id];
	for (const n of nodes) {
		const [x, y] = pos(n), g = document.createElementNS(ns, "g");
		g.style.cursor = "grab";
		const sel = n.id === picked;
		g.innerHTML = `<circle cx="${x}" cy="${y}" r="${sel ? 20 : 15}" fill="${color}" stroke="${sel ? "#fff" : "rgba(0,0,0,.4)"}" stroke-width="${sel ? 3 : 2}"/>` +
			`<text x="${x}" y="${y - 24}" fill="#e9e2d2" font-size="13" text-anchor="middle">${String(n.name || n.id).replace(/[&<>]/g, "")}</text>` +
			((n.max_rank || 1) > 1 ? `<text x="${x}" y="${y + 32}" fill="#9ea3b6" font-size="11" text-anchor="middle">×${n.max_rank}</text>` : "");
		// Drag to move (snaps to half steps); a click without moving picks it.
		g.addEventListener("pointerdown", ev => {
			ev.preventDefault();
			g.setPointerCapture(ev.pointerId);
			const pt = svg.createSVGPoint();
			const toGrid = e => { pt.x = e.clientX; pt.y = e.clientY; const p = pt.matrixTransform(svg.getScreenCTM().inverse()); return [Math.max(0, Math.round(((p.x - CELL / 2) / CELL) * 2) / 2), Math.max(0, Math.round(((maxY + 1) - (p.y - CELL / 2) / CELL) * 2) / 2)]; };
			const start = [n.col, n.row];
			let moved = false;
			g.onpointermove = e => {
				const [cx, cy] = toGrid(e);
				if (cx !== n.col || cy !== n.row) { moved = true; n.col = cx; n.row = cy; const [nx, ny] = pos(n); g.setAttribute("transform", `translate(${nx - x},${ny - y})`); }
			};
			g.onpointerup = () => {
				g.onpointermove = g.onpointerup = null;
				skillPick[tree.id] = n.id;
				if (moved && nodes.some(o => o !== n && o.col === n.col && o.row === n.row)) { n.col = start[0]; n.row = start[1]; }
				changed(true);
			};
		});
		svg.appendChild(g);
	}
	box.appendChild(svg);
	const tools = el("div", { className: "row" });
	tools.style.cssText = "display:flex;gap:8px;margin-bottom:10px;align-items:center";
	const add = el("button", { textContent: "+ Skill" });
	add.onclick = () => {
		let k = 1; while (nodes.some(x => x.id === tree.id + "_" + k)) k++;
		let x = 0, y = 0;
		while (nodes.some(m => m.col === x && m.row === y)) { x++; if (x > 5) { x = 0; y++; } }
		const node = { id: tree.id + "_" + k, name: "New Skill", description: "", icon: "", row: y, col: x, max_rank: 1, cost: 1, min_level: 1, points_above: 0, requires: [], effect: "stat", stat: "attack", per_rank: 1, ability: "", key: "" };
		nodes.push(node);
		skillPick[tree.id] = node.id;
		changed(true);
	};
	tools.append(add, el("span", { className: "hint", textContent: "Row 0 is the bottom: trees grow upwards. Click a skill to edit it, drag it to move it. A skill needs at least one rank in each skill it's linked from." }));
	box.appendChild(tools);
	const node = nodes.find(n => n.id === skillPick[tree.id]);
	if (!node) return box;
	const form = el("div", { className: "grid" });
	const field = (label, input) => { const f = el("div", { className: "field" }); f.append(el("label", { textContent: label }), input); form.appendChild(f); return input; };
	const txt = (k, label) => { const i = el("input", { type: "text", value: node[k] ?? "" }); i.onchange = () => { const old = node.id; node[k] = k === "id" ? i.value.toLowerCase().replace(/[^a-z0-9_]/g, "_") : i.value; if (k === "id") { for (const o of nodes) o.requires = (o.requires || []).map(r => r === old ? node.id : r); skillPick[tree.id] = node[k]; } changed(true); }; return field(label, i); };
	const num = (k, label, step = 1) => { const i = el("input", { type: "number", value: node[k] ?? 0, step }); i.onchange = () => { const v = parseFloat(i.value); if (!Number.isNaN(v)) { node[k] = v; changed(true); } }; return field(label, i); };
	txt("name", "Name");
	txt("id", "ID (saves remember skills by id)");
	num("col", "Column (x, half steps)", 0.5);
	num("row", "Row (y, 0 = bottom)", 0.5);
	num("max_rank", "Ranks");
	num("cost", "Points per rank");
	num("min_level", "Level needed");
	num("points_above", "Points spent in this tree first");
	const startLab = el("label", { className: "check" });
	const startCb = el("input", { type: "checkbox", checked: !!node.starting });
	startCb.onchange = () => { node.starting = startCb.checked; changed(true); };
	startLab.append(startCb, document.createTextNode(" Starting skill (known from the start, free; its ability goes in hotbar box 1)"));
	field("Starting", startLab);
	const eff = selectOf([["stat", "Raises a stat"], ["ability", "Teaches an ability"], ["passive", "Passive (game code by key)"]], node.effect || "stat", false);
	eff.onchange = () => { node.effect = eff.value; changed(true); };
	field("Each rank", eff);
	if ((node.effect || "stat") === "stat") {
		const st = selectOf(SKILL_STATS, node.stat || "attack", false);
		st.onchange = () => { node.stat = st.value; changed(); };
		field("Stat", st);
		num("per_rank", "Amount per rank", 0.1);
	} else if (node.effect === "ability") {
		const ab = selectOf(abilityOptions(), node.ability || "", true);
		ab.onchange = () => { node.ability = ab.value; changed(); };
		field("Ability", ab);
	} else {
		txt("key", "Passive key");
	}
	box.appendChild(form);
	const desc = el("div", { className: "field wide" });
	const ta = el("textarea", { value: node.description || "" });
	ta.oninput = () => { node.description = ta.value; changed(); };
	desc.append(el("label", { textContent: "Description" }), ta);
	box.appendChild(desc);
	const req = el("div", { className: "field wide" });
	req.appendChild(el("label", { textContent: "Needs (a rank in each; drawn as lines)" }));
	for (const other of nodes) {
		if (other === node) continue;
		const lab = el("label", { className: "check" });
		const cb = el("input", { type: "checkbox", checked: (node.requires || []).includes(other.id) });
		cb.onchange = () => { node.requires = (node.requires || []).filter(x => x !== other.id); if (cb.checked) node.requires.push(other.id); changed(true); };
		lab.append(cb, document.createTextNode(" " + (other.name || other.id)));
		lab.style.cssText = "display:inline-flex;gap:4px;margin-right:12px";
		req.appendChild(lab);
	}
	box.appendChild(req);
	const rm = el("button", { textContent: "Delete this skill" });
	rm.onclick = () => { tree.nodes = nodes.filter(n => n !== node); for (const n of tree.nodes) n.requires = (n.requires || []).filter(x => x !== node.id); delete skillPick[tree.id]; changed(true); };
	box.appendChild(rm);
	return box;
}

function eventPagesEditor(entry) {
	const root = el("div", { className: "ev" });
	entry.pages = entry.pages || [];
	if (!entry.pages.length) entry.pages.push(blankPage());
	const id = entry.id;
	let pi = Math.min(evUI.page[id] || 0, entry.pages.length - 1);
	evUI.page[id] = pi;
	const page = entry.pages[pi];
	const redo = () => changed(true);
	const edit = () => changed();

	// Page tabs.
	const tabs = el("div", { className: "ev-tabs" });
	entry.pages.forEach((p, i) => {
		const b = el("button", { textContent: String(i + 1), className: i === pi ? "on" : "", title: condText(p.conditions) });
		b.onclick = () => { evUI.page[id] = i; evUI.sel = null; render(); };
		tabs.appendChild(b);
	});
	const tool = (text, fn, title) => { const b = el("button", { textContent: text, title: title || "" }); b.onclick = fn; tabs.appendChild(b); return b; };
	tool("New page", () => { entry.pages.push(blankPage()); evUI.page[id] = entry.pages.length - 1; redo(); });
	tool("Copy page", () => { entry.pages.splice(pi + 1, 0, clone(page)); evUI.page[id] = pi + 1; redo(); });
	tool("Delete page", () => { if (entry.pages.length > 1 && confirm("Delete page " + (pi + 1) + "?")) { entry.pages.splice(pi, 1); evUI.page[id] = Math.max(0, pi - 1); redo(); } }).disabled = entry.pages.length < 2;
	tabs.appendChild(el("span", { className: "ev-hint", textContent: "The last page whose conditions hold is the one in use." }));
	root.appendChild(tabs);

	// Page settings.
	const grid = el("div", { className: "grid" });
	const cell = (labelText, control, help, wide) => {
		const w = el("div", { className: "field" + (wide ? " wide" : "") });
		w.append(el("label", { textContent: labelText }), control);
		if (help) w.appendChild(el("div", { className: "help", textContent: help }));
		grid.appendChild(w);
	};
	const conds = el("div", { className: "field wide" });
	page.conditions = page.conditions || [];
	conds.append(el("label", { textContent: "Conditions (all must hold; none = always)" }), conditionsEditor(page.conditions, r => changed(r)));
	grid.appendChild(conds);
	const trig = selectOf(TRIGGERS, page.trigger || "action", false);
	trig.onchange = () => { page.trigger = trig.value; edit(); };
	cell("Trigger", trig);
	const model = el("input", { type: "text", value: page.model || "", placeholder: "(nothing: an invisible area)" });
	model.setAttribute("list", "ev-models");
	model.oninput = () => { page.model = model.value.trim(); edit(); };
	cell("Shows", model, "builtin:chest…, prop:<name> (assets/props), npc:<id> (talk to the NPC to run this page), or a res:// scene.", false);
	const text = (key, help, ph) => { const i = el("input", { type: "text", value: page[key] || "", placeholder: ph || "" }); i.oninput = () => { page[key] = i.value; edit(); }; return i; };
	cell("Prompt", text("prompt", "", "Examine"), "Shown over it: \"Space  Examine\".");
	cell("Speaker", text("speaker", "", "(the event's name)"), "Name on text boxes unless a text says otherwise.");
	const check = (key, labelText, help, def) => {
		const w = el("div", { className: "field check" });
		const c = el("input", { type: "checkbox", checked: page[key] === undefined ? def : !!page[key] });
		c.onchange = () => { page[key] = c.checked; edit(); };
		w.append(c, el("label", { textContent: labelText }));
		if (help) w.title = help;
		grid.appendChild(w);
	};
	check("solid", "Blocks the way", "A solid box the size of the event (not for props or NPCs, which have their own).", false);
	check("marker", "Sparkles", "Golden motes and a glow, so it can be spotted.", false);
	check("freeze", "Player waits while it runs", "", true);
	const fs1 = el("fieldset");
	fs1.append(el("legend", { textContent: "Page " + (pi + 1) }), grid);
	root.appendChild(fs1);

	// Commands.
	page.commands = page.commands || [];
	const lines = flattenCommands(page.commands, 0, []);
	lines.push({ list: page.commands, i: page.commands.length, depth: 0, insert: true });
	const isSel = l => evUI.sel && l.list === evUI.sel.list && l.i === evUI.sel.i && !l.label;
	if (!lines.some(isSel)) evUI.sel = null;
	const fs2 = el("fieldset");
	fs2.appendChild(el("legend", { textContent: "Commands" }));
	const bar = el("div", { className: "ev-bar" });
	const pick = el("select");
	pick.appendChild(el("option", { value: "", textContent: "+ Insert command…" }));
	for (const [g, keys] of CMD_GROUPS) {
		const og = el("optgroup", { label: g });
		for (const k of keys) og.appendChild(el("option", { value: k, textContent: CMDS[k].label }));
		pick.appendChild(og);
	}
	pick.onchange = () => {
		if (!pick.value) return;
		const at = evUI.sel || { list: page.commands, i: page.commands.length };
		at.list.splice(at.i, 0, CMDS[pick.value].make());
		evUI.sel = { list: at.list, i: at.i };
		redo();
	};
	const selCmd = () => (evUI.sel && evUI.sel.i < evUI.sel.list.length ? evUI.sel : null);
	const btn = (t, fn, title, off) => { const b = el("button", { textContent: t, title }); b.onclick = fn; b.disabled = !!off; bar.appendChild(b); };
	bar.appendChild(pick);
	btn("↑", () => { const s = selCmd(); if (s && s.i > 0) { const [c] = s.list.splice(s.i, 1); s.list.splice(s.i - 1, 0, c); s.i--; redo(); } }, "Move up", !selCmd());
	btn("↓", () => { const s = selCmd(); if (s && s.i < s.list.length - 1) { const [c] = s.list.splice(s.i, 1); s.list.splice(s.i + 1, 0, c); s.i++; redo(); } }, "Move down", !selCmd());
	btn("Copy", () => { const s = selCmd(); if (s) { evUI.clip = clone(s.list[s.i]); toast("Copied"); render(); } }, "Copy the command (and what's inside it)", !selCmd());
	btn("Paste", () => { const at = evUI.sel || { list: page.commands, i: page.commands.length }; at.list.splice(at.i, 0, clone(evUI.clip)); redo(); }, "Paste above the selected line", !evUI.clip);
	btn("Delete", () => { const s = selCmd(); if (s) { s.list.splice(s.i, 1); redo(); } }, "Delete the command (Del)", !selCmd());
	fs2.appendChild(bar);
	const listBox = el("div", { className: "ev-lines", tabIndex: 0 });
	for (const l of lines) {
		const d = el("div", { className: "ev-line" + (l.label ? " label" : "") + (l.insert ? " insert" : "") + (isSel(l) ? " on" : "") });
		d.style.paddingLeft = (8 + l.depth * 22) + "px";
		if (l.label) d.textContent = l.label;
		else if (l.insert) d.textContent = "◆";
		else {
			const def = CMDS[l.c.cmd];
			d.textContent = "◆" + (def ? def.show(l.c) : "Unknown: " + l.c.cmd);
			d.className += " c-" + l.c.cmd;
		}
		if (!l.label) d.onclick = () => { evUI.sel = { list: l.list, i: l.i }; render(); };
		listBox.appendChild(d);
	}
	listBox.onkeydown = e => {
		if (e.key === "Delete" && selCmd()) { const s = selCmd(); s.list.splice(s.i, 1); redo(); }
	};
	fs2.appendChild(listBox);
	// The selected command's settings.
	const s = selCmd();
	if (s) fs2.appendChild(commandEditor(s.list[s.i]));
	else fs2.appendChild(el("div", { className: "help", textContent: "Click a line to select it. New commands go above the selected line; select a ◆ line to add at the end of a list (or a branch)." }));
	root.appendChild(fs2);

	// Suggestions for "Shows".
	const dl = el("datalist", { id: "ev-models" });
	for (const m of BUILTIN_MODELS) dl.appendChild(el("option", { value: "builtin:" + m }));
	for (const p of (assets.props || [])) dl.appendChild(el("option", { value: "prop:" + p }));
	for (const [n] of npcOptions()) dl.appendChild(el("option", { value: "npc:" + n }));
	root.appendChild(dl);
	return root;
}

// A form for one command.
function commandEditor(c) {
	const def = CMDS[c.cmd];
	const box = el("div", { className: "ev-edit" });
	box.appendChild(el("div", { className: "ev-edit-title", textContent: def ? def.label : c.cmd }));
	if (!def) return box;
	const grid = el("div", { className: "grid" });
	if (!def.fields.length) grid.appendChild(el("div", { className: "help", textContent: "Nothing to set." }));
	for (const [key, labelText, type, extra] of def.fields) {
		const w = el("div", { className: "field" + (["textarea", "conditions", "options"].includes(type) ? " wide" : "") });
		const lab = el("label", { textContent: labelText });
		const setv = (v, re) => {
			c[key] = v;
			changed(re);
			const on = document.querySelector(".ev-line.on");
			if (on && !re) on.textContent = "◆" + def.show(c);
		};
		let ctl;
		switch (type) {
			case "text": ctl = el("input", { type: "text", value: c[key] ?? "" }); ctl.oninput = () => setv(ctl.value); break;
			case "textarea": ctl = el("textarea", { value: c[key] ?? "", rows: 3 }); ctl.oninput = () => setv(ctl.value); break;
			case "number": case "int": ctl = el("input", { type: "number", value: c[key] ?? 0, step: type === "int" ? 1 : "any" });
				ctl.oninput = () => { const v = type === "int" ? parseInt(ctl.value, 10) : parseFloat(ctl.value); if (!Number.isNaN(v)) setv(v); }; break;
			case "bool": w.className = "field check"; ctl = el("input", { type: "checkbox", checked: !!c[key] }); ctl.onchange = () => setv(ctl.checked); w.append(ctl, lab); grid.appendChild(w); continue;
			case "onoff": ctl = selectOf([["on", "ON"], ["off", "OFF"]], c[key] === false ? "off" : "on", false); ctl.onchange = () => setv(ctl.value === "on"); break;
			case "select": ctl = selectOf(typeof extra === "function" ? extra() : extra, c[key], typeof extra === "function"); ctl.onchange = () => setv(ctl.value); break;
			case "letter": ctl = selectOf(["A", "B", "C", "D"], c[key], false); ctl.onchange = () => setv(ctl.value); break;
			case "switch": ctl = selectOf(switchOptions(), c[key], true); ctl.onchange = () => setv(ctl.value); break;
			case "variable": ctl = selectOf(variableOptions(), c[key], true); ctl.onchange = () => setv(ctl.value); break;
			case "item": ctl = selectOf(itemOptions(), c[key], true); ctl.onchange = () => setv(ctl.value); break;
			case "event": ctl = selectOf(eventOptions(), c[key], true); ctl.onchange = () => setv(ctl.value); break;
			case "npc": ctl = selectOf(npcOptions(), c[key], true); ctl.onchange = () => setv(ctl.value); break;
			case "anim": ctl = selectOf(assets.animations || [], c[key], true); ctl.onchange = () => setv(ctl.value); break;
			case "sound": ctl = selectOf((assets.sounds || []).map(p => [p, soundLabel(p)]), c[key], true); ctl.onchange = () => setv(ctl.value); break;
			case "level": ctl = selectOf((assets.levels || []).map(p => [p, p.replace("res://scenes/levels/", "")]), c[key], true); ctl.onchange = () => setv(ctl.value, true); break;
			case "marker": {
				ctl = el("input", { type: "text", value: c[key] ?? "" });
				const dl = el("datalist", { id: "ev-markers" });
				const markers = (assets.markers || {});
				const lv = c.scene || Object.keys(markers)[0] || "";
				for (const m of (markers[lv] || [])) dl.appendChild(el("option", { value: m }));
				ctl.setAttribute("list", "ev-markers");
				ctl.oninput = () => setv(ctl.value);
				w.appendChild(dl);
				break;
			}
			case "navtarget": {
				// "kind:what": a marker / event / NPC / enemies by node name / the player.
				const cur = String(c[key] || "marker:");
				let kind = cur.split(":")[0], what = cur.slice(kind.length + 1);
				ctl = el("div", { className: "row" });
				const ks = selectOf([["marker", "A marker / node"], ["event", "An event"], ["npc", "An NPC"], ["enemy", "Enemies (node names)"], ["player", "The player"]], kind, false);
				ks.style.flex = "0 0 160px";
				let vs;
				const build = () => {
					if (vs) vs.remove();
					if (kind === "event") vs = selectOf(eventOptions(), what, true);
					else if (kind === "npc") vs = selectOf(npcOptions(), what, true);
					else if (kind === "player") vs = el("span");
					else {
						vs = el("input", { type: "text", value: what, placeholder: kind === "enemy" ? "Bandit, Bandit2, Bandit3" : "node name" });
						if (kind === "marker") {
							const dl = el("datalist", { id: "ev-nav-markers" });
							for (const m of (Object.values(assets.markers || {}).flat())) dl.appendChild(el("option", { value: m }));
							vs.setAttribute("list", "ev-nav-markers");
							ctl.appendChild(dl);
						}
					}
					const upd = () => { what = vs.value || ""; setv(kind + ":" + what); };
					vs.oninput = upd; vs.onchange = upd;
					ctl.appendChild(vs);
				};
				ks.onchange = () => { kind = ks.value; what = ""; setv(kind + ":"); build(); };
				ctl.appendChild(ks);
				build();
				break;
			}
			case "vec3": {
				ctl = el("div", { className: "rect" });
				const v = Array.isArray(c[key]) ? c[key].slice() : null;
				["x", "y", "z"].forEach((n, i) => {
					const inp = el("input", { type: "number", value: v ? v[i] : "", step: "any", placeholder: n });
					inp.oninput = () => {
						const vals = [...ctl.querySelectorAll("input")].map(x => x.value === "" ? NaN : parseFloat(x.value));
						if (vals.every(x => Number.isNaN(x))) { delete c[key]; changed(); } else if (vals.every(x => !Number.isNaN(x))) setv(vals);
					};
					ctl.appendChild(inp);
				});
				break;
			}
			case "color": {
				ctl = el("input", { type: "color", value: c[key] || "#ffffff" });
				ctl.oninput = () => setv(ctl.value);
				break;
			}
			case "conditions": c[key] = c[key] || []; ctl = conditionsEditor(c[key], r => changed(r)); break;
			case "options": {
				c.options = c.options || [];
				c.branches = c.branches || [];
				ctl = el("div", { className: "list-field" });
				c.options.forEach((o, i) => {
					const row = el("div", { className: "row" });
					const t = el("input", { type: "text", value: o });
					t.oninput = () => { c.options[i] = t.value; changed(); };
					const rm = el("button", { textContent: "✕", title: "Remove (and what's under it)" });
					rm.onclick = () => { c.options.splice(i, 1); c.branches.splice(i, 1); if ((c.cancel ?? -1) >= c.options.length) c.cancel = -1; changed(true); };
					row.append(t, rm);
					ctl.appendChild(row);
				});
				const add = el("button", { textContent: "+ Choice" });
				add.onclick = () => { c.options.push("Choice " + (c.options.length + 1)); c.branches.push([]); changed(true); };
				ctl.appendChild(add);
				break;
			}
			case "choiceends": {
				c[key] = Array.isArray(c[key]) ? c[key] : [];
				ctl = el("div", { className: "row" });
				(c.options || []).forEach((o, i) => {
					const lab2 = el("label", { className: "check" });
					const cb = el("input", { type: "checkbox", checked: c[key].includes(i) });
					cb.onchange = () => { const s = new Set(c[key]); cb.checked ? s.add(i) : s.delete(i); setv([...s].sort((a, b) => a - b)); };
					lab2.append(cb, document.createTextNode(" [" + o + "]  "));
					ctl.appendChild(lab2);
				});
				break;
			}
			case "cancel": {
				const opts = [["-1", "Nothing (just close)"]].concat((c.options || []).map((o, i) => [String(i), "[" + o + "]"]));
				ctl = selectOf(opts, String(c[key] ?? -1), false);
				ctl.onchange = () => setv(parseInt(ctl.value, 10));
				break;
			}
		}
		w.append(lab, ctl);
		if (typeof extra === "string") w.appendChild(el("div", { className: "help", textContent: extra }));
		grid.appendChild(w);
	}
	box.appendChild(grid);
	return box;
}

// Names for switches and variables (Switches tab).
function nameListEditor(list, prefix, onChange) {
	const box = el("div", { className: "list-field" });
	list.forEach((s, i) => {
		const row = el("div", { className: "row" });
		const num = el("span", { textContent: String(i + 1).padStart(4, "0") });
		const idIn = el("input", { type: "text", value: s.id, title: "ID (used by events)" });
		idIn.style.flex = "0 0 200px";
		idIn.oninput = () => { s.id = idIn.value.toLowerCase().replace(/[^a-z0-9_]/g, "_"); onChange(); };
		const nm = el("input", { type: "text", value: s.name || "", placeholder: "Name" });
		nm.oninput = () => { s.name = nm.value; onChange(); };
		const rm = el("button", { textContent: "✕" });
		rm.onclick = () => { list.splice(i, 1); onChange(true); };
		row.append(num, idIn, nm, rm);
		box.appendChild(row);
	});
	const add = el("button", { textContent: "+ Add" });
	add.onclick = () => { let n = list.length + 1; while (list.some(s => s.id === prefix + n)) n++; list.push({ id: prefix + n, name: "" }); onChange(true); };
	box.appendChild(add);
	return box;
}

load();
